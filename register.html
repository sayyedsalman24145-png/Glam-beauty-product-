<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Glam Beauty</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <a class="brand" href="index.html">GLAM <span>BEAUTY</span></a>
  <main class="auth-card">
    <p class="eyebrow">JOIN GLAM BEAUTY</p>
    <h1>Create Your Account</h1>
    <form id="registerForm">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Enter your full name" required>
      <label for="registerEmail">Email Address</label>
      <input type="email" id="registerEmail" placeholder="Enter your email" required>
      <label for="registerPassword">Create Password</label>
      <input type="password" id="registerPassword" placeholder="At least 6 characters" minlength="6" required>
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Enter password again" minlength="6" required>
      <button class="submit-button" type="submit">Create Account</button>
      <p class="message" id="registerMessage" aria-live="polite"></p>
    </form>
    <p class="switch-link">Already have an account? <a href="login.html">Login here</a></p>
    <a class="back-link" href="index.html">← Back to Home</a>
  </main>
  <script src="script.js"></script>
</body>
</html>
