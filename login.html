<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Glam Beauty</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <a class="brand" href="index.html">GLAM <span>BEAUTY</span></a>
  <main class="auth-card">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Login to Your Account</h1>
    <form id="loginForm">
      <label for="loginEmail">Email Address</label>
      <input type="email" id="loginEmail" placeholder="Enter your email" required>
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password" minlength="6" required>
      <button class="submit-button" type="submit">Login</button>
      <p class="message" id="loginMessage" aria-live="polite"></p>
    </form>
    <p class="switch-link">Don't have an account? <a href="register.html">Register here</a></p>
    <a class="back-link" href="index.html">← Back to Home</a>
  </main>
  <script src="script.js"></script>
</body>
</html>
